[project]
readme = "readme.md"
name = "cv-screener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=8.19,<9",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[openai]>=2.44.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "reportlab>=5.0.1",
    "sentence-transformers>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cv-screener = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/main.py", "src/settings.py", "src/llm.py", "src/generation", "src/search"]
sources = ["src"]
